# 手元で試すための門番。claude.ai から来たリクエストだけを通す。
# トンネルが2本あるので、ポートでホストを分ける（80：MCP のホスト、81：認可サーバーのホスト）。

# cloudflared から来たときだけ、Cloudflare が付ける本当の接続元を信じる。
set_real_ip_from 172.28.0.10;
set_real_ip_from 172.28.0.11;
real_ip_header   CF-Connecting-IP;

proxy_http_version 1.1;
proxy_set_header   Host $host;
proxy_buffering    off;

# MCP のホスト：MCP サーバー本体と、そのメタデータ（RFC 9728）
server {
    listen 80;

    # claude.ai がカスタムコネクターに繋ぎに来る範囲
    # https://platform.claude.com/docs/en/api/ip-addresses
    allow 160.79.104.0/21;
    allow 153.61.208.0/20;
    deny  all;

    location = /mcp {
        proxy_pass http://mcp:8080;
    }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8080;
    }
    location / {
        return 404;
    }
}

# 認可サーバーのホスト：仮の認可サーバー（authserver）
server {
    listen 81;

    allow 160.79.104.0/21;
    allow 153.61.208.0/20;
    deny  all;

    # ログイン画面の入口は、claude.ai ではなくユーザーのブラウザが開く。ここだけは誰でも通す。
    # 中身は authserver が返す「ここまで来ました」の文字だけ。
    location = /authorize {
        allow all;
        proxy_pass http://authserver:8080;
    }

    # それ以外（認可サーバーのメタデータ、/register など）
    location / {
        proxy_pass http://authserver:8080;
    }
}
