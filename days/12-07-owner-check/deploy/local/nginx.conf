# 手元で試すための門番。claude.ai から来たリクエストだけを通す。
# トンネルが2本あるので、ポートでホストを分ける（80：MCP のホスト、81：認可サーバーのホスト）。

# cloudflared から来たときだけ、Cloudflare が付ける本当の接続元を信じる。
set_real_ip_from 172.28.0.10;
set_real_ip_from 172.28.0.11;
real_ip_header   CF-Connecting-IP;

# /token に何が届いたかを見るためのログ（12/5）。resource が付いてくるかを確かめる。
# 本文には code や code_verifier、シークレットが入るので、試し終わったら make down でログごと消す。
# Authorization ヘッダーは中身を出さず、方式（Basic など）だけ出す。
map $http_authorization $auth_scheme {
    "~^(?<authscheme>\S+)" $authscheme;
    default            "-";
}
log_format token escape=json '{"time":"$time_iso8601","client_ip":"$remote_addr","request":"$request",'
                             '"status":$status,"authorization":"$auth_scheme","body":"$request_body"}';

# どちらのホスト（MCP か認可サーバーか）に来たかを見分けるためのログ。
log_format hosted '$time_iso8601 $host "$request" $status "$http_user_agent"';

proxy_http_version 1.1;
proxy_set_header   Host $host;
proxy_buffering    off;

# MCP のホスト：MCP サーバー本体と、そのメタデータ（RFC 9728）
server {
    listen 80;
    access_log /dev/stdout hosted;

    # claude.ai がカスタムコネクターに繋ぎに来る範囲
    # https://platform.claude.com/docs/en/api/ip-addresses
    allow 160.79.104.0/21;
    allow 153.61.208.0/20;
    deny  all;

    location = /mcp {
        proxy_pass http://mcp:8080;
    }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8080;
    }
    location / {
        return 404;
    }
}

# 認可サーバーのホスト：Keycloak
server {
    listen 81;
    access_log /dev/stdout hosted;

    # 止めた realm（make realm-off）は、ここに置いたファイルで 503 を返す。認可サーバーが止まっているのと同じに見せる。
    include /etc/nginx/down/*.conf;

    allow 160.79.104.0/21;
    allow 153.61.208.0/20;
    deny  all;

    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # ログイン画面まわりは、claude.ai ではなくユーザーのブラウザが来る。ここだけは誰でも通す。
    # 入口（/authorize にあたる）、ログインの送信先、画面の CSS や JavaScript。
    # 12/7 から realm が2つ（tenant-a、tenant-b）あるので、どちらも同じように扱う。
    location ~ ^/realms/tenant-[ab]/protocol/openid-connect/auth {
        allow all;
        proxy_pass http://keycloak:8080;
    }
    location ~ ^/realms/tenant-[ab]/login-actions/ {
        allow all;
        proxy_pass http://keycloak:8080;
    }
    location ^~ /resources/ {
        allow all;
        proxy_pass http://keycloak:8080;
    }

    # トークンの窓口。claude.ai のサーバーから来る。本文をログに出す。
    location ~ ^/realms/tenant-[ab]/protocol/openid-connect/token$ {
        access_log /dev/stdout token;
        proxy_pass http://keycloak:8080;
    }

    # 管理画面と、管理者用の realm は外に出さない（手元の 127.0.0.1:8180 から使う）。
    location ^~ /admin       { return 404; }
    location ^~ /realms/master { return 404; }

    # それ以外（メタデータ、DCR の登録、/token など）は claude.ai から来る。
    location / {
        proxy_pass http://keycloak:8080;
    }
}
